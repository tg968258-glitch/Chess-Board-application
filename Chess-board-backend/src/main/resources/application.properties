spring.application.name=ChessBoardApplication
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.config.import=optional:file:.env[.properties],optional:file:Chess-board-backend/.env[.properties]
app.security.username=${CHESS_USERNAME:}
app.security.password=${CHESS_PASSWORD:}
app.security.allowed-origin=${CHESS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
